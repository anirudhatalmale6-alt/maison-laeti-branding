<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="300" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Teddy bear icon - minimalist line art in gold -->
  <g transform="translate(150, 120)" fill="none" stroke="#C8A04A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left ear -->
    <circle cx="-28" cy="-48" r="14"/>
    <!-- Right ear -->
    <circle cx="28" cy="-48" r="14"/>
    <!-- Inner ear detail left -->
    <circle cx="-28" cy="-48" r="7" stroke-width="1.2"/>
    <!-- Inner ear detail right -->
    <circle cx="28" cy="-48" r="7" stroke-width="1.2"/>

    <!-- Head -->
    <circle cx="0" cy="-28" r="32"/>

    <!-- Eyes -->
    <circle cx="-10" cy="-30" r="2.5" fill="#C8A04A" stroke="none"/>
    <circle cx="10" cy="-30" r="2.5" fill="#C8A04A" stroke="none"/>

    <!-- Nose -->
    <ellipse cx="0" cy="-22" rx="4" ry="3" fill="#C8A04A" stroke="none"/>

    <!-- Mouth -->
    <path d="M -5,-19 C -3,-16 3,-16 5,-19" stroke-width="1.5"/>

    <!-- Body -->
    <ellipse cx="0" cy="22" rx="28" ry="30"/>

    <!-- Belly circle -->
    <circle cx="0" cy="20" r="15" stroke-width="1.2" opacity="0.5"/>

    <!-- Left arm -->
    <path d="M -28,8 C -42,14 -44,30 -35,38 C -28,44 -18,40 -16,32"/>
    <!-- Left paw pad -->
    <ellipse cx="-36" cy="36" rx="6" ry="5" stroke-width="1.5"/>

    <!-- Right arm -->
    <path d="M 28,8 C 42,14 44,30 35,38 C 28,44 18,40 16,32"/>
    <!-- Right paw pad -->
    <ellipse cx="36" cy="36" rx="6" ry="5" stroke-width="1.5"/>

    <!-- Left leg -->
    <path d="M -18,48 C -22,58 -20,68 -12,72"/>
    <ellipse cx="-14" cy="70" rx="8" ry="5" stroke-width="1.5"/>

    <!-- Right leg -->
    <path d="M 18,48 C 22,58 20,68 12,72"/>
    <ellipse cx="14" cy="70" rx="8" ry="5" stroke-width="1.5"/>
  </g>

  <!-- Maison Petit text -->
  <text x="150" y="240" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', serif" font-weight="500" font-size="38" fill="#C8A04A" letter-spacing="1">Maison Petit</text>
</svg>
