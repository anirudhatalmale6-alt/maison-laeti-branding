<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Comfortaa:wght@400&amp;family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- Box lid - cream base -->
  <rect width="500" height="500" fill="#F9F6F0"/>

  <!-- Subtle border -->
  <rect x="15" y="15" width="470" height="470" rx="2" fill="none" stroke="#C8A04A" stroke-width="0.5" opacity="0.3"/>

  <!-- Monogram with needle/thread at top center -->
  <g transform="translate(250, 160) scale(0.65)" opacity="0.6">
    <!-- Needle -->
    <g fill="none" stroke="#C8A04A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-55" y1="55" x2="55" y2="-55"/>
      <ellipse cx="48" cy="-48" rx="4" ry="6.5" transform="rotate(-45, 48, -48)"/>
      <circle cx="-57" cy="57" r="1.8" fill="#C8A04A"/>
    </g>
    <!-- Thread -->
    <g fill="none" stroke="#C8A04A" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <path d="M 40,-40 C 65,-15 35,20 5,15 C -25,10 -45,-15 -35,-40 C -25,-65 10,-60 30,-42"/>
      <path d="M 5,15 C -20,35 -55,25 -50,0 C -45,-25 -20,-40 5,-32"/>
      <path d="M -50,0 C -68,12 -62,35 -48,45"/>
    </g>
    <!-- LA monogram -->
    <text x="0" y="18" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="95" fill="#C8A04A" opacity="0.9">LA</text>
  </g>

  <!-- MAISON text -->
  <text x="250" y="290" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="700" font-size="52" fill="#C8A04A" letter-spacing="8">MAISON</text>

  <!-- laeti text -->
  <text x="250" y="340" text-anchor="middle" font-family="'Comfortaa', 'Century Gothic', sans-serif" font-weight="400" font-size="44" fill="#C8A04A" letter-spacing="2">laeti</text>

  <!-- Tagline -->
  <text x="250" y="380" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="8" fill="#C8A04A" letter-spacing="4" opacity="0.6">L'ART DE BIEN DORMIR</text>
</svg>
