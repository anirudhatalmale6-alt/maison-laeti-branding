<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Comfortaa:wght@400&amp;display=swap');
    </style>
    <!-- Repeating pattern tile -->
    <pattern id="brandPattern" x="0" y="0" width="200" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <!-- MAISON -->
      <text x="20" y="35" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#1B2A6B" letter-spacing="3" opacity="0.12">MAISON</text>
      <!-- laeti -->
      <text x="28" y="55" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="12" fill="#1B2A6B" letter-spacing="1" opacity="0.12">laeti</text>
      <!-- Offset repeat -->
      <text x="120" y="90" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#1B2A6B" letter-spacing="3" opacity="0.12">MAISON</text>
      <text x="128" y="110" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="12" fill="#1B2A6B" letter-spacing="1" opacity="0.12">laeti</text>
    </pattern>
  </defs>

  <!-- Cream base paper color -->
  <rect width="400" height="400" fill="#F9F6F0"/>

  <!-- Repeating brand pattern -->
  <rect width="400" height="400" fill="url(#brandPattern)"/>
</svg>
