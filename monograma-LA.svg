<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <g transform="translate(150, 150)">
    <!-- Needle -->
    <g fill="none" stroke="#C8A04A" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-48" y1="48" x2="48" y2="-48" stroke-width="3"/>
      <ellipse cx="40" cy="-40" rx="4" ry="7" transform="rotate(-45, 40, -40)" stroke-width="1.8"/>
      <ellipse cx="32" cy="-32" rx="2.5" ry="4.5" transform="rotate(-45, 32, -32)" stroke-width="1.5"/>
      <circle cx="-50" cy="50" r="1.2" fill="#C8A04A" stroke="none"/>
    </g>

    <!-- Thread -->
    <g fill="none" stroke="#C8A04A" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M 25,-20 C 60,10 45,48 5,55 C -35,62 -65,28 -58,-10 C -52,-45 -18,-62 15,-52 C 42,-44 45,-18 28,0"/>
      <path d="M 5,55 C -18,38 -38,8 -35,-22"/>
      <path d="M -58,-10 C -72,10 -65,42 -50,55"/>
    </g>

    <!-- LA monogram -->
    <text x="0" y="18" text-anchor="middle" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="95" fill="#C8A04A" opacity="0.9">LA</text>
  </g>
</svg>
