<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- Monogram: intertwined LA in elegant script with needle and thread -->
  <g transform="translate(150, 150)">
    <!-- Needle -->
    <g fill="none" stroke="#C8A04A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-55" y1="55" x2="55" y2="-55"/>
      <ellipse cx="48" cy="-48" rx="4" ry="6.5" transform="rotate(-45, 48, -48)"/>
      <circle cx="-57" cy="57" r="1.8" fill="#C8A04A"/>
    </g>

    <!-- Thread flowing from needle eye -->
    <g fill="none" stroke="#C8A04A" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <path d="M 40,-40 C 65,-15 35,20 5,15 C -25,10 -45,-15 -35,-40 C -25,-65 10,-60 30,-42"/>
      <path d="M 5,15 C -20,35 -55,25 -50,0 C -45,-25 -20,-40 5,-32"/>
      <path d="M -50,0 C -68,12 -62,35 -48,45"/>
    </g>

    <!-- LA monogram text -->
    <text x="0" y="18" text-anchor="middle" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="95" fill="#C8A04A" opacity="0.9">LA</text>
  </g>
</svg>
