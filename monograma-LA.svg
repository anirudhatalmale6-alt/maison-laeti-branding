<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- Monogram: intertwined LA in elegant script with needle and thread -->
  <g transform="translate(150, 150)">
    <!-- Needle - refined, elegant diagonal -->
    <g fill="none" stroke="#C8A04A" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-48" y1="48" x2="42" y2="-42" stroke-width="2.5"/>
      <ellipse cx="36" cy="-36" rx="3.5" ry="6" transform="rotate(-45, 36, -36)" stroke-width="2"/>
      <circle cx="-50" cy="50" r="1.5" fill="#C8A04A" stroke="none"/>
    </g>

    <!-- Thread - smooth flowing curves from needle eye -->
    <g fill="none" stroke="#C8A04A" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <path d="M 30,-30 C 52,-8 30,22 6,18 C -18,14 -32,-6 -25,-26 C -18,-46 8,-44 22,-32"/>
      <path d="M 6,18 C -14,34 -42,26 -38,6 C -34,-14 -18,-26 2,-20"/>
      <path d="M -38,6 C -50,16 -46,34 -36,40"/>
    </g>

    <!-- LA monogram text -->
    <text x="0" y="18" text-anchor="middle" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="95" fill="#C8A04A" opacity="0.9">LA</text>
  </g>
</svg>
