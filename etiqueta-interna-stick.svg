<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 350" width="200" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&amp;family=Comfortaa:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- Internal garment stick label - white background for sewing/adhesive -->
  <rect width="200" height="350" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Brand name at top -->
  <text x="100" y="28" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#1B2A6B" letter-spacing="4">MAISON</text>
  <text x="100" y="44" text-anchor="middle" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="11" fill="#1B2A6B" letter-spacing="1">laeti</text>

  <!-- Thin gold separator -->
  <line x1="30" y1="55" x2="170" y2="55" stroke="#C8A04A" stroke-width="0.5"/>

  <!-- Composition section -->
  <text x="100" y="75" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="7" fill="#333" letter-spacing="2">COMPOSICAO / COMPOSITION</text>
  <line x1="25" y1="85" x2="175" y2="85" stroke="#e0e0e0" stroke-width="0.3"/>
  <line x1="25" y1="97" x2="175" y2="97" stroke="#e0e0e0" stroke-width="0.3"/>
  <line x1="25" y1="109" x2="175" y2="109" stroke="#e0e0e0" stroke-width="0.3"/>

  <!-- Size section -->
  <text x="100" y="130" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="7" fill="#333" letter-spacing="2">TAMANHO / SIZE</text>

  <!-- Size boxes -->
  <g font-family="'Montserrat', sans-serif" font-size="8" fill="#666" text-anchor="middle">
    <rect x="20" y="138" width="30" height="20" rx="2" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <text x="35" y="152">PP</text>
    <rect x="55" y="138" width="30" height="20" rx="2" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <text x="70" y="152">P</text>
    <rect x="90" y="138" width="30" height="20" rx="2" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <text x="105" y="152">M</text>
    <rect x="125" y="138" width="30" height="20" rx="2" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <text x="140" y="152">G</text>
    <rect x="160" y="138" width="30" height="20" rx="2" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <text x="175" y="152">GG</text>
  </g>

  <!-- Care instructions section -->
  <text x="100" y="180" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="7" fill="#333" letter-spacing="2">CUIDADOS / CARE</text>

  <!-- Care symbols row (standard textile care symbols as simplified icons) -->
  <g transform="translate(100, 205)" fill="none" stroke="#555" stroke-width="1.2" text-anchor="middle">
    <!-- Wash 30C -->
    <g transform="translate(-65, 0)">
      <path d="M -10,-8 L -10,5 C -10,10 10,10 10,5 L 10,-8" />
      <path d="M -12,-8 C -6,-4 0,-8 6,-4 12,-8" />
      <text x="0" y="3" font-size="6" fill="#555" stroke="none">30</text>
    </g>
    <!-- Do not bleach -->
    <g transform="translate(-32, 0)">
      <polygon points="0,-10 12,8 -12,8"/>
      <line x1="-8" y1="8" x2="8" y2="-8"/>
    </g>
    <!-- Iron low -->
    <g transform="translate(0, 0)">
      <path d="M -10,6 L 10,6 L 8,-4 L -6,-4 L -10,-8 Z"/>
      <circle cx="1" cy="1" r="1.5" fill="#555" stroke="none"/>
    </g>
    <!-- Do not tumble dry -->
    <g transform="translate(32, 0)">
      <rect x="-10" y="-8" width="20" height="16" rx="1"/>
      <circle cx="0" cy="0" r="6" fill="none"/>
      <line x1="-7" y1="7" x2="7" y2="-7"/>
    </g>
    <!-- Dry clean -->
    <g transform="translate(65, 0)">
      <circle cx="0" cy="0" r="9"/>
      <text x="0" y="4" font-size="10" fill="#555" stroke="none" font-family="'Montserrat', sans-serif">P</text>
    </g>
  </g>

  <!-- Care text instructions -->
  <g font-family="'Montserrat', sans-serif" font-size="6" fill="#888" text-anchor="middle">
    <text x="100" y="230">Lavar a mao ou maquina ciclo delicado 30C</text>
    <text x="100" y="240">Nao usar alvejante / Do not bleach</text>
    <text x="100" y="250">Passar em temperatura baixa / Iron low</text>
    <text x="100" y="260">Nao usar secadora / Do not tumble dry</text>
  </g>

  <!-- Gold separator -->
  <line x1="30" y1="272" x2="170" y2="272" stroke="#C8A04A" stroke-width="0.5"/>

  <!-- Made in / Country -->
  <text x="100" y="290" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="7" fill="#555" letter-spacing="1">FABRICADO NO BRASIL</text>
  <text x="100" y="302" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="6" fill="#888" letter-spacing="1">MADE IN BRAZIL</text>

  <!-- CNPJ placeholder -->
  <text x="100" y="320" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="5.5" fill="#aaa">CNPJ: ___.___.___/____-__</text>

  <!-- Website -->
  <text x="100" y="340" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="5.5" fill="#C8A04A" letter-spacing="1.5">MAISONLAETI.COM.BR</text>
</svg>
