<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&amp;family=Comfortaa:wght@400&amp;family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- Card background -->
  <rect width="400" height="250" rx="4" fill="#F9F6F0"/>

  <!-- Subtle gold border -->
  <rect x="8" y="8" width="384" height="234" rx="2" fill="none" stroke="#C8A04A" stroke-width="0.6" opacity="0.4"/>

  <!-- Small monogram at top -->
  <text x="200" y="50" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="32" fill="#C8A04A" opacity="0.7">LA</text>

  <!-- Gold line -->
  <line x1="160" y1="60" x2="240" y2="60" stroke="#C8A04A" stroke-width="0.5" opacity="0.4"/>

  <!-- Merci / Obrigada text -->
  <text x="200" y="95" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="36" fill="#1B2A6B">Merci</text>

  <!-- Thank you message -->
  <text x="200" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="9" fill="#1B2A6B" letter-spacing="1" opacity="0.8">Obrigada por escolher Maison Laeti.</text>
  <text x="200" y="142" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="9" fill="#1B2A6B" letter-spacing="1" opacity="0.8">Cada peca foi pensada para transformar</text>
  <text x="200" y="159" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="9" fill="#1B2A6B" letter-spacing="1" opacity="0.8">suas noites em momentos de puro conforto.</text>

  <!-- Gold line bottom -->
  <line x1="140" y1="175" x2="260" y2="175" stroke="#C8A04A" stroke-width="0.5" opacity="0.4"/>

  <!-- Brand name -->
  <text x="200" y="200" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#1B2A6B" letter-spacing="4">MAISON</text>
  <text x="200" y="218" text-anchor="middle" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="13" fill="#1B2A6B" letter-spacing="1">laeti</text>

  <!-- Social/website -->
  <text x="200" y="240" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="6" fill="#C8A04A" letter-spacing="2">@MAISONLAETI  |  MAISONLAETI.COM.BR</text>
</svg>
