<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&amp;family=Comfortaa:wght@400&amp;family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <rect width="220" height="320" fill="#F5EFE6"/>
  <rect x="8" y="8" width="204" height="304" rx="2" fill="none" stroke="#C8A04A" stroke-width="0.5" opacity="0.4"/>

  <line x1="40" y1="30" x2="180" y2="30" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>

  <text x="110" y="60" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#1B2A6B" letter-spacing="6">MAISON</text>
  <text x="110" y="82" text-anchor="middle" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="16" fill="#1B2A6B" letter-spacing="2">laeti</text>

  <line x1="50" y1="95" x2="170" y2="95" stroke="#C8A04A" stroke-width="0.5" opacity="0.5"/>

  <text x="110" y="115" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="7" fill="#C8A04A" letter-spacing="4">L'ART DE BIEN DORMIR</text>

  <!-- Fragrance name -->
  <text x="110" y="152" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="36" fill="#1B2A6B">Cote d'Azur</text>

  <line x1="60" y1="165" x2="160" y2="165" stroke="#C8A04A" stroke-width="0.3" opacity="0.4"/>

  <!-- Eau de Parfum -->
  <text x="110" y="185" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="8" fill="#1B2A6B" letter-spacing="3" opacity="0.8">EAU DE PARFUM</text>

  <!-- Scent notes -->
  <text x="110" y="210" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="6" fill="#C8A04A" letter-spacing="1" opacity="0.8">SAL MARINHO  |  CITRICOS</text>
  <text x="110" y="222" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="6" fill="#C8A04A" letter-spacing="1" opacity="0.8">BRISA DO MEDITERRANEO</text>

  <!-- Decorative element -->
  <line x1="80" y1="238" x2="140" y2="238" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>

  <!-- Volume -->
  <text x="110" y="260" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="14" fill="#1B2A6B" letter-spacing="2">25ml</text>
  <text x="110" y="273" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="6" fill="#1B2A6B" letter-spacing="1" opacity="0.5">0.84 FL OZ</text>

  <!-- Bottom line -->
  <line x1="40" y1="290" x2="180" y2="290" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>
  <text x="110" y="305" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="5" fill="#1B2A6B" letter-spacing="2" opacity="0.4">MAISONLAETI.COM.BR</text>
</svg>
