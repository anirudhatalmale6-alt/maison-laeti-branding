<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&amp;family=Comfortaa:wght@400&amp;family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- Black/dark luxury background for the signature line -->
  <rect width="220" height="320" fill="#0D0D0D"/>
  <rect x="8" y="8" width="204" height="304" rx="2" fill="none" stroke="#C8A04A" stroke-width="0.8" opacity="0.6"/>
  <rect x="12" y="12" width="196" height="296" rx="1" fill="none" stroke="#C8A04A" stroke-width="0.3" opacity="0.2"/>

  <text x="110" y="55" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#C8A04A" letter-spacing="6">MAISON</text>
  <text x="110" y="77" text-anchor="middle" font-family="'Comfortaa', sans-serif" font-weight="400" font-size="16" fill="#C8A04A" letter-spacing="2">laeti</text>

  <line x1="50" y1="90" x2="170" y2="90" stroke="#C8A04A" stroke-width="0.5" opacity="0.5"/>

  <text x="110" y="110" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="7" fill="#C8A04A" letter-spacing="4" opacity="0.6">L'ART DE BIEN DORMIR</text>

  <!-- Fragrance name - large and prominent -->
  <text x="110" y="155" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="44" fill="#C8A04A">Signature</text>

  <line x1="50" y1="168" x2="170" y2="168" stroke="#C8A04A" stroke-width="0.3" opacity="0.4"/>

  <!-- Eau de Parfum -->
  <text x="110" y="188" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="8" fill="#F5EFE6" letter-spacing="3" opacity="0.8">EAU DE PARFUM</text>

  <!-- Scent notes -->
  <text x="110" y="213" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="6" fill="#C8A04A" letter-spacing="1" opacity="0.7">BERGAMOTA  |  NEROLI  |  WHITE MUSK</text>

  <!-- Decorative element -->
  <line x1="80" y1="230" x2="140" y2="230" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>

  <!-- Volume options -->
  <text x="80" y="255" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="13" fill="#F5EFE6" letter-spacing="2">50ml</text>
  <text x="80" y="267" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="5.5" fill="#F5EFE6" letter-spacing="1" opacity="0.5">1.69 FL OZ</text>

  <line x1="110" y1="245" x2="110" y2="270" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>

  <text x="140" y="255" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="13" fill="#F5EFE6" letter-spacing="2">100ml</text>
  <text x="140" y="267" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="5.5" fill="#F5EFE6" letter-spacing="1" opacity="0.5">3.38 FL OZ</text>

  <!-- Bottom -->
  <line x1="40" y1="285" x2="180" y2="285" stroke="#C8A04A" stroke-width="0.3" opacity="0.3"/>
  <text x="110" y="300" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="5" fill="#C8A04A" letter-spacing="2" opacity="0.4">MAISONLAETI.COM.BR</text>
</svg>
